<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de positionnement SEO — Le Guide ANCV</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1a2332;--muted:#6b7688;--line:#e4e8ef;
    --brand:#0a5ad4;--brand-soft:#e8f0fd;--up:#1a9e5f;--down:#d9433f;--flat:#8a94a6;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;}
  header{background:linear-gradient(120deg,#0a5ad4,#0846a6);color:#fff;padding:26px 30px;}
  header h1{margin:0 0 4px;font-size:20px;font-weight:700;}
  header .sub{font-size:13px;opacity:.85;}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 24px 60px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .kpi .val{font-size:24px;font-weight:700;margin-top:6px;}
  .note{background:#fff8e6;border:1px solid #f0d98a;color:#7a5b12;border-radius:10px;padding:11px 15px;font-size:13px;margin-bottom:18px;}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;}
  .controls input,.controls select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);}
  .controls input[type=search]{flex:1;min-width:220px;}
  .controls .grp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .btn{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  .count{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{position:sticky;top:0;background:#fafbfd;font-weight:600;cursor:pointer;user-select:none;z-index:1;}
  th:hover{color:var(--brand);}
  th .arrow{font-size:10px;opacity:.5;}
  td.kw{white-space:normal;max-width:320px;font-weight:600;}
  td.url a{color:var(--brand);text-decoration:none;font-size:12px;}
  td.url a:hover{text-decoration:underline;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .pos{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:6px;font-weight:700;background:var(--brand-soft);color:var(--brand);}
  .pos.top3{background:#e5f6ec;color:var(--up);}
  .pos.na{background:#f0f1f4;color:var(--muted);font-weight:600;}
  .kd{display:inline-block;min-width:34px;text-align:center;padding:2px 7px;border-radius:6px;font-weight:600;}
  .kd.easy{background:#e5f6ec;color:var(--up);}
  .kd.med{background:#fff4e0;color:#c07a12;}
  .kd.hard{background:#fdeceb;color:var(--down);}
  .kd.na{background:#f0f1f4;color:var(--muted);}
  .evo{font-weight:700;}
  .evo.up{color:var(--up);}.evo.down{color:var(--down);}.evo.flat{color:var(--flat);}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef1f6;color:var(--muted);white-space:nowrap;}
  tr:hover td{background:#f9fbff;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
  @media (max-width:720px){td.url,th.url,td.intent,th.intent{display:none;}}
</style>
</head>
<body>
<header>
  <h1>Suivi de positionnement SEO — Le Guide ANCV</h1>
  <div class="sub" id="sub">Liste de mots-clés suivie &middot; Google France &middot; Source : Semrush</div>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="note" id="note" style="display:none"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Rechercher un mot-clé…">
    <span class="grp">Statut
      <select id="fstatus">
        <option value="all">Tous</option>
        <option value="ranked">Positionnés</option>
        <option value="notranked">Non positionnés</option>
      </select>
    </span>
    <span class="grp">Position &le;
      <select id="fpos"><option value="0">Toutes</option><option value="3">Top 3</option><option value="10">Top 10</option><option value="20">Top 20</option></select>
    </span>
    <span class="grp">KD &le;
      <select id="fkd"><option value="0">Toutes</option><option value="30">30 (facile)</option><option value="50">50 (moyen)</option><option value="70">70 (difficile)</option></select>
    </span>
    <span class="grp">Vol. min <input type="number" id="fvol" value="0" min="0" style="width:90px"></span>
    <button class="btn ghost" id="export">Exporter CSV</button>
  </div>

  <div class="count" id="count">Chargement…</div>
  <div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
  <footer>Reporting SEO — liste de mots-clés Le Guide ANCV. Volume &amp; KD : données Semrush (base FR). Mise à jour automatique hebdomadaire via GitHub Actions.</footer>
</div>

<script>
let DATA=[];
const cols=[
  {key:"kw",label:"Mot-clé",type:"str"},
  {key:"vol",label:"Volume",type:"num"},
  {key:"kd",label:"KD %",type:"num"},
  {key:"intent",label:"Intention",type:"str"},
  {key:"pos",label:"Position",type:"num"},
  {key:"prev",label:"Pos. préc.",type:"num"},
  {key:"diff",label:"Évolution",type:"num"},
  {key:"url",label:"URL positionnée",type:"str"},
];
let sortKey="vol",sortDir=-1;
const fmt=n=>n==null?"—":n.toLocaleString("fr-FR");
const kdClass=k=>k==null?"na":(k<=30?"easy":(k<=50?"med":"hard"));
function evoCell(d){if(d==null)return '<span class="evo flat">—</span>';
  if(d>0)return `<span class="evo up">▲ ${d}</span>`;if(d<0)return `<span class="evo down">▼ ${Math.abs(d)}</span>`;
  return '<span class="evo flat">–</span>';}
function shortUrl(u){return u?u.replace(/^https?:\/\//,"").replace(/\/$/,""):"—";}
function g(id){return document.getElementById(id);}

function filtered(){
  const q=g("q").value.toLowerCase().trim(),st=g("fstatus").value,
    fpos=+g("fpos").value,fkd=+g("fkd").value,fvol=+g("fvol").value||0;
  return DATA.filter(r=>{
    if(st==="ranked"&&r.pos==null)return false;
    if(st==="notranked"&&r.pos!=null)return false;
    if(fpos&&(r.pos==null||r.pos>fpos))return false;
    if(fkd&&(r.kd==null||r.kd>fkd))return false;
    if(r.vol<fvol)return false;
    if(q&&!r.kw.toLowerCase().includes(q))return false;
    return true;
  });
}
function sorted(rows){
  const c=cols.find(c=>c.key===sortKey)||{type:"num"};
  return rows.slice().sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(x==null)x=c.type==="num"?1e12:"";if(y==null)y=c.type==="num"?1e12:"";
    if(c.type==="num")return (x-y)*sortDir;
    return (""+x).localeCompare(""+y,"fr")*sortDir;
  });
}
function renderHead(){
  g("head").innerHTML=cols.map(c=>{
    const a=c.key===sortKey?(sortDir<0?"▼":"▲"):"";
    const cl=(c.key==="url"?"url":"")+(c.key==="intent"?" intent":"");
    return `<th data-k="${c.key}" class="${cl}">${c.label} <span class="arrow">${a}</span></th>`;
  }).join("");
  document.querySelectorAll("#head th").forEach(th=>{th.onclick=()=>{const k=th.dataset.k;
    if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==="kw"||k==="url"||k==="intent")?1:-1;}render();};});
}
function render(){
  renderHead();
  const rows=sorted(filtered());
  g("body").innerHTML=rows.map(r=>`
    <tr><td class="kw">${r.kw}</td>
      <td class="num">${fmt(r.vol)}</td>
      <td class="num">${r.kd==null?'<span class="kd na">n/d</span>':`<span class="kd ${kdClass(r.kd)}">${r.kd}</span>`}</td>
      <td class="intent">${r.intent?`<span class="chip">${r.intent}</span>`:"—"}</td>
      <td class="num">${r.pos==null?'<span class="pos na">n/p</span>':`<span class="pos ${r.pos<=3?'top3':''}">${r.pos}</span>`}</td>
      <td class="num">${r.prev==null?"—":r.prev}</td>
      <td class="num">${evoCell(r.diff)}</td>
      <td class="url">${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${shortUrl(r.url)}</a>`:"—"}</td>
    </tr>`).join("");
  g("count").textContent=`${rows.length} mot(s)-clé(s) affiché(s) sur ${DATA.length}`;
  renderKpis();
}
function renderKpis(){
  const ranked=DATA.filter(r=>r.pos!=null);
  const top3=ranked.filter(r=>r.pos<=3).length,top10=ranked.filter(r=>r.pos<=10).length;
  const vol=DATA.reduce((s,r)=>s+r.vol,0);
  const avg=ranked.length?(ranked.reduce((s,r)=>s+r.pos,0)/ranked.length):null;
  const k=[["Mots-clés suivis",fmt(DATA.length)],["Positionnés",fmt(ranked.length)],
    ["Top 3",fmt(top3)],["Top 10",fmt(top10)],["Position moy.",avg==null?"—":avg.toFixed(1)],["Volume cumulé",fmt(vol)]];
  g("kpis").innerHTML=k.map(([l,v])=>`<div class="kpi"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join("");
}
function exportCSV(){
  const rows=sorted(filtered());
  const head=["Mot-cle","Volume","KD","Intention","Position","Position precedente","Evolution","URL"];
  const lines=[head.join(";")].concat(rows.map(r=>
    [r.kw,r.vol,r.kd==null?"":r.kd,r.intent,r.pos==null?"":r.pos,r.prev==null?"":r.prev,r.diff==null?"":r.diff,r.url]
    .map(v=>`"${(""+v).replace(/"/g,'""')}"`).join(";")));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="suivi_leguide_ancv.csv";a.click();
}
["q","fstatus","fpos","fkd","fvol"].forEach(id=>g(id).addEventListener("input",render));
g("export").addEventListener("click",exportCSV);

fetch("./data.json?v="+Date.now()).then(r=>r.json()).then(p=>{
  DATA=p.rows||[];
  g("sub").innerHTML=`Liste de mots-clés suivie &middot; Google France &middot; Source : Semrush &middot; Mise à jour du ${p.generated||"—"}`;
  if(p.ranked!=null && p.ranked < (p.count||0)){
    const n=g("note");n.style.display="block";
    n.innerHTML=`<b>Positions.</b> ${p.ranked}/${p.count} mots-clés positionnés dans le top 100. « n/p » = non positionné. `+
      `Les positions se remplissent quand la clé API a accès au projet de suivi (voir README).`;
  }
  render();
}).catch(e=>{g("count").textContent="Erreur de chargement de data.json : "+e;});
</script>
</body>
</html>
